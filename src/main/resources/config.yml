        material: DROPPER
        label: "&cWithdraw"
        name: "&cWithdraw Sound"
        lore:
          - "&7Played when you withdraw coins."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      upgrade:
        slot: 16
        material: GOLD_BLOCK
        label: "&6Upgrade"
        name: "&6Upgrade Sound"
        lore:
          - "&7Played when you buy a bank"
          - "&7account upgrade."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      error:
        slot: 21
        material: BARRIER
        label: "&4Error"
        name: "&4Error Sound"
        lore:
          - "&7Played when something goes wrong,"
          - "&7like a full bank or not enough coins."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      click:
        slot: 23
        material: STONE_BUTTON
        label: "&7Menu Click"
        name: "&7Menu Click Sound"
        lore:
          - "&7Played when you click buttons"
          - "&7inside the bank menus."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      go-back:
        slot: 31
        material: ARROW
        name: "&aGo Back"
        lore:
          - "&7To Bank Settings"

  # =====================================================================
  # Personal Vault inventory (title + optional Close button row)
  # =====================================================================
  vault-menu:
    title: "Personal Vault"
    # Optional Close button. false = plain chest (default). true = one extra
    # bottom row with a Close button is added (then max rows becomes 5).
    close-button: false
    filler-material: GRAY_STAINED_GLASS_PANE   # the extra bottom row (only if close-button: true)
    close-position: 5        # where the Close button sits in that row (1 - 9)
    items:
      close:
        material: BARRIER
        name: "&cClose"

  # =====================================================================
  # "Are you sure?" menu shown before buying the vault
  # %price% = vault.price, %slots% = vault size, %purse% = player's purse
  # =====================================================================
  vault-confirm-menu:
    title: "Buy Personal Vault"
    size: 27
    filler-material: GRAY_STAINED_GLASS_PANE
    items:
      confirm:
        slot: 11
        material: LIME_STAINED_GLASS_PANE
        name: "&aConfirm Purchase"
        lore:
          - "&7Pay &6$%price% coins &7to unlock"
          - "&7your Personal Vault."
          - ""
          - "&eClick to confirm!"
      info:
        slot: 13
        material: ENDER_CHEST
        name: "&5Personal Vault"
        lore:
          - "&7A private storage with"
          - "&e%slots% slots &7for your items."
          - ""
          - "&7Price: &6$%price% coins"
          - "&7Your purse: &6$%purse% coins"
      cancel:
        slot: 15
        material: RED_STAINED_GLASS_PANE
        name: "&cCancel"
        lore:
          - "&7Go back to the bank."

  sign-input:
    deposit:
      - ""
      - "^^^^^^^^^^^^^^^"
      - "Enter your amount"
      - "to deposit"
    withdraw:
      - ""
      - "^^^^^^^^^^^^^^^"
      - "Enter your amount"
      - "to withdraw"

  transaction-format: "%sign%&6%amount%&7, %time% ago by %actor%"
  no-transactions-text: "&7No transactions yet"

