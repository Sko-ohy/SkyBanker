# =====================================================================
# SkyBanker Configuration File
# created by skoohy
# Everything here is customizable: item materials, names, and lore.
# Placeholders you can use inside any lore line, where noted:
#   %balance%   - player's current bank balance (formatted)
#   %purse%     - player's current purse/wallet balance (formatted)
#   %limit%     - player's bank max-balance limit for their tier (formatted)
#   %account%   - player's current account tier name
#   %amount%    - the amount involved in that specific menu action
#   %status%    - upgrade tier status text (see bank-tiers below)
#   %cost%      - tier's upgrade cost (formatted)
#   %max_balance% / %max_interest% - tier's stats (formatted)
#   %interest_timer% - time remaining until next interest payout
# =====================================================================

settings:
  debug-mode: false
  interest-interval-hours: 31
  max-stored-transactions: 20
  withdraw-percent-option: 0.2

# =====================================================================
# Update checker
# Checks for a newer version of SkyBanker every time the server starts
# (and once every 24 hours after that). Runs in the background and never
# lags the server. If there is no internet, the check is simply skipped.
# =====================================================================
update-checker:
  enabled: true
  notify-admins: true    # tell admins (skybanker.admin) in chat when they join

# =====================================================================
# Personal Vault - a private item storage players buy once.
# The button is in the Settings menu (right of the profile head).
# =====================================================================
vault:
  enabled: true
  price: 5000000.0       # coins a player pays ONCE to unlock the vault (from their purse)
  rows: 3                # storage size: 1 - 6 rows (3 rows = 27 slots)

gui:
  main-menu:
    title: "Personal Bank Account"
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    items:
      deposit:
        slot: 11
        material: CHEST
        name: "&aDeposit Coins"
        lore:
          - "&7Current balance: &6$%balance%"
          - ""
          - "&7Store coins in the bank to keep"
          - "&7them safe while you go on"
          - "&7adventures!"
          - ""
          - "&7You will earn &b2%&7 interest"
          - "&7every 31h"
          - ""
          - "&7Until interest: &b%interest_timer%"
          - ""
          - "&eClick to deposit coins!"
      withdraw:
        slot: 13
        material: DROPPER
        name: "&cWithdraw Coins"
        lore:
          - "&7Current balance: &6$%balance%"
          - ""
          - "&7Take your coins out of the bank"
          - "&7in order to spend them."
          - ""
          - "&eClick to withdraw coins!"
      transactions:
        slot: 15
        material: MAP
        name: "&aRecent transactions"
      go-back:
        slot: 30
        material: ARROW
        name: "&aGo Back"
        lore:
          - "&7To Personal Bank Account"
      close:
        slot: 31
        material: BARRIER
        name: "&cClose"
      info:
        slot: 32
        material: REDSTONE_TORCH
        name: "&aInformation"
        lore:
          - "&7Keep your coins safe in the bank!"
          - "&7You lose half the coins in your"
          - "&7purse when dying in combat."
          - ""
          - "&7Balance limit: &6$%limit%"
          - ""
          - "&7The banker rewards you every &331"
          - "&7hours with &3interest &7for the"
          - "&7coins in your bank balance."
          - ""
          - "&7Interest in: &b%interest_timer%"
          - "&7Last interest: &6%last_interest% coins"
          - "&7Projected: &6%projected_interest% coins &b(%projected_percent%%)"
      upgrades:
        slot: 35
        material: GOLD_BLOCK
        name: "&6Bank Upgrades"
        lore:
          - "&7Are you so rich that you can't"
          - "&7even store your coins?"
          - ""
          - "&7Current account: %account%"
          - "&7Bank limit: &6$%limit%"
          - ""
          - "&eClick to view upgrades!"
      settings:
        slot: 27
        material: COMPARATOR
        name: "&aSettings"
        lore:
          - "&7View your bank profile, manage"
          - "&7your sound settings and open"
          - "&7your Personal Vault."
          - ""
          - "&eClick to open settings!"

  deposit-menu:
    title: "Bank Deposit"
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    items:
      whole-purse:
        slot: 11
        material: CHEST
        amount: 64
        name: "&aYour whole purse"
        lore:
          - "&8Bank deposit"
          - ""
          - "&7Current balance: &6$%balance%"
          - "&7Amount to deposit: &6$%amount%"
          - ""
          - "&eClick to deposit coins!"
      half-purse:
        slot: 13
        material: CHEST
        amount: 32
        name: "&aHalf your purse"
        lore:
          - "&8Bank deposit"
          - ""
          - "&7Current balance: &6$%balance%"
          - "&7Amount to deposit: &6$%amount%"
          - ""
          - "&eClick to deposit coins!"
      specific-amount:
        slot: 15
        material: OAK_SIGN
        name: "&aSpecific Amount"
        lore:
          - "&7Current balance: &6$%balance%"
          - ""
          - "&eClick to enter amount!"
      go-back:
        slot: 31
        material: ARROW
        name: "&aGo Back"
        lore:
          - "&7To Personal Bank Account"

  withdraw-menu:
    title: "Bank Withdrawal"
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    items:
      everything:
        slot: 10
        material: DROPPER
        amount: 64
        name: "&aEverything in the account"
        lore:
          - "&8Bank withdrawal"
          - ""
          - "&7Current balance: &6$%balance%"
          - "&7Amount to withdraw: &6$%amount%"
          - ""
          - "&eClick to withdraw coins!"
      half:
        slot: 12
        material: DROPPER
        amount: 32
        name: "&aHalf the account"
        lore:
          - "&8Bank withdrawal"
          - ""
          - "&7Current balance: &6$%balance%"
          - "&7Amount to withdraw: &6$%amount%"
          - ""
          - "&eClick to withdraw coins!"
      percent:
        slot: 14
        material: DROPPER
        name: "&aWithdraw 20%"
        lore:
          - "&8Bank withdrawal"
          - ""
          - "&7Current balance: &6$%balance%"
          - "&7Amount to withdraw: &6$%amount%"
          - ""
          - "&eClick to withdraw coins!"
      specific-amount:
        slot: 16
        material: OAK_SIGN
        name: "&aSpecific Amount"
        lore:
          - "&7Current balance: &6$%balance%"
          - ""
          - "&eClick to enter amount!"
      go-back:
        slot: 31
        material: ARROW
        name: "&aGo Back"
        lore:
          - "&7To Personal Bank Account"

  upgrades-menu:
    title: "Bank Account Upgrades"
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    go-back-slot: 31

  # =====================================================================
  # Settings menu (opened from the Settings button in the main menu)
  # Set enabled to false to turn the whole feature off - the button
  # disappears from the main menu and the menu can't be opened.
  # Extra placeholders: %player% %status% %created% %created_ago% %purse%
  #   %rank% %total_accounts% %progress% %progress_bar% %space_left%
  #   (plus the usual balance/limit/account/interest ones).
  #   The profile item is always the player's head.
  # =====================================================================
  settings-menu:
    enabled: true
    title: "Bank Settings"
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    date-format: "dd MMM yyyy"
    status-active: "&aActive"
    status-full: "&6Bank Full"
    items:
      profile:
        slot: 13
        name: "&6%player% Bank Account"
        lore:
          - ""
          - "&7Account status: %status%"
          - "&7Account: %account%"
          - "&7Balance: &6$%balance% &7/ &6$%limit%"
          - "&7Filled: %progress_bar% &e%progress%%"
          - "&7Space left: &6$%space_left%"
          - ""
          - "&7Interest in: &b%interest_timer%"
          - "&7Last interest: &6%last_interest% coins"
          - "&7Projected: &6%projected_interest% coins &b(%projected_percent%%)"
          - ""
          - "&7Account created: &e%created%"
          - "&7Account age: &e%created_ago%"
          - ""
          - "&7Purse: &6$%purse%"
          - "&7Bank limit: &6$%limit%"
      sounds:
        # Left of the profile head. Click = open the sound menu.
        enabled: true
        slot: 11
        material: NOTE_BLOCK
        name: "&aSound Settings"
        lore:
          - "&7Choose which bank sounds you"
          - "&7want to hear."
          - ""
          - "&7All sounds: %status%"
          - ""
          - "&eClick to customize!"
      vault:
        # Right of the profile head. Price / size: see the "vault:" section at the top.
        # %price% = vault.price, %slots% = vault size
        slot: 15
        material: ENDER_CHEST
        name: "&5Personal Vault"
        # shown while the player has NOT bought the vault yet
        lore-locked:
          - "&7Store your items safely in your"
          - "&7own private vault."
          - ""
          - "&7Price: &6$%price% coins"
          - "&7Status: &cLocked"
          - ""
          - "&eClick to buy!"
        # shown after the player bought it
        lore-unlocked:
          - "&7Keep your valuable items safe"
          - "&7in your own private vault."
          - ""
          - "&eClick to open!"
      go-back:
        slot: 31
        material: ARROW
        name: "&aGo Back"
        lore:
          - "&7To Personal Bank Account"

  # =====================================================================
  # Sound menu (right-click the Sounds button in the Settings menu)
  # Left-click a button = turn that sound on/off.
  # Right-click a button = preview that sound.
  # %status% is replaced by status-on / status-off below.
  # "label" is the short name shown in the action bar when toggled.
  # =====================================================================
  sound-menu:
    title: "Sound Settings"
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    status-on: "&aON"
    status-off: "&cOFF"
    items:
      master:
        slot: 4
        material: NOTE_BLOCK
        label: "&6All Sounds"
        name: "&6All Sounds"
        lore:
          - "&7Master switch for every sound"
          - "&7the banker plays for you."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      interest:
        slot: 10
        material: EXPERIENCE_BOTTLE
        label: "&bInterest"
        name: "&bInterest Sound"
        lore:
          - "&7Played when you receive your"
          - "&7bank interest."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      deposit:
        slot: 12
        material: CHEST
        label: "&aDeposit"
        name: "&aDeposit Sound"
        lore:
          - "&7Played when you deposit coins."
          - ""
          - "&7Status: %status%"
          - ""
          - "&eLeft-click to toggle!"
          - "&eRight-click to preview!"
      withdraw:
